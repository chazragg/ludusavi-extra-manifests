RuneLite:
  files:
    "<home>/.runelite":
      tags:
        - config

World of Warcraft:
  files:
    "<winDrive>/Program Files (x86)/World of Warcraft/*/Interface/**":
      tags:
        - config
    "<winDrive>/Program Files (x86)/World of Warcraft/*/WTF/**":
      tags:
        - save
        - config
    "<winDrive>/Program Files (x86)/World of Warcraft/*/Screenshots/**":
      tags:
        - media
    "<winDrive>/Program Files/World of Warcraft/*/Interface/**":
      tags:
        - config
    "<winDrive>/Program Files/World of Warcraft/*/WTF/**":
      tags:
        - save
        - config
    "<winDrive>/Program Files/World of Warcraft/*/Screenshots/**":
      tags:
        - media
Prism Launcher:
  files:
    "<winAppData>/PrismLauncher/instances":
      tags:
        - config
    "<winAppData>/PrismLauncher/icons":
      tags:
        - config

Ludusavi (Software):
  files:
    "<winAppData>/ludusavi":
      tags:
        - config
      when:
        - os: windows

YARG:
  files:
    "<winLocalAppData>/YARC":
      tags:
        - config
      when:
        - os: windows
