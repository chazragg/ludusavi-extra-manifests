RuneLite:
  files:
    "<home>/.runelite":
      tags:
        - config

World of Warcraft:
  files:
    # Desktop (CachyOS) paths
    "<home>/data/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/Interface/**":
      tags: [config]
    "<home>/data/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/WTF/**":
      tags: [save, config]
    "<home>/data/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/Screenshots/**":
      tags: [media]
    "<home>/data/Faugus/*/drive_c/Program Files/World of Warcraft/*/Interface/**":
      tags: [config]
    "<home>/data/Faugus/*/drive_c/Program Files/World of Warcraft/*/WTF/**":
      tags: [save, config]
    "<home>/data/Faugus/*/drive_c/Program Files/World of Warcraft/*/Screenshots/**":
      tags: [media]

    # Steam Deck default paths
    "<home>/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/Interface/**":
      tags: [config]
    "<home>/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/WTF/**":
      tags: [save, config]
    "<home>/Faugus/*/drive_c/Program Files (x86)/World of Warcraft/*/Screenshots/**":
      tags: [media]
    "<home>/Faugus/*/drive_c/Program Files/World of Warcraft/*/Interface/**":
      tags: [config]
    "<home>/Faugus/*/drive_c/Program Files/World of Warcraft/*/WTF/**":
      tags: [save, config]
    "<home>/Faugus/*/drive_c/Program Files/World of Warcraft/*/Screenshots/**":
      tags: [media]

Prism Launcher:
  files:
    "<winAppData>/PrismLauncher/instances":
      tags:
        - config
    "<winAppData>/PrismLauncher/icons":
      tags:
        - config

Ludusavi (Software):
  files:
    "<winAppData>/ludusavi":
      tags:
        - config
      when:
        - os: windows

YARG:
  files:
    "<winLocalAppData>/YARC":
      tags:
        - config
      when:
        - os: windows
