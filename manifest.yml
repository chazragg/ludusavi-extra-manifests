RuneLite:
  files:
    "<home>/.runelite":
      tags:
        - config

World of Warcraft:
  installDir:
    World of Warcraft: {}
  files:
    "*/Interface/**":
      tags:
        - config
    "*/WTF/**":
      tags:
        - save
        - config
    "*/Screenshots/**":
      tags:
        - media

Prism Launcher:
  files:
    "<winAppData>/PrismLauncher/instances":
      tags:
        - config
    "<winAppData>/PrismLauncher/icons":
      tags:
        - config

Ludusavi (Software):
  files:
    "<winAppData>/ludusavi":
      tags:
        - config
      when:
        - os: windows

YARG:
  files:
    "<winLocalAppData>/YARC":
      tags:
        - config
      when:
        - os: windows
