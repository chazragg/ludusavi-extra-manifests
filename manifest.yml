RuneLite:
  files:
    "<home>/.runelite":
      tags:
        - config

World of Warcraft:
  files:
    # <root> resolves to each "Program Files*" folder under drive_c,
    # so one entry covers both "Program Files" and "Program Files (x86)".
    "<base>/World of Warcraft/*/Interface/**":
      tags:
        - config
    "<base>/World of Warcraft/*/WTF/**":
      tags:
        - config
        - save
    "<base>/World of Warcraft/*/Screenshots/**":
      tags:
        - media
  id:
    lutris: world-of-warcraft


Prism Launcher:
  files:
    "<winAppData>/PrismLauncher/instances":
      tags:
        - config
    "<winAppData>/PrismLauncher/icons":
      tags:
        - config

Ludusavi (Software):
  files:
    "<winAppData>/ludusavi":
      tags:
        - config
      when:
        - os: windows

YARG:
  files:
    "<winLocalAppData>/YARC":
      tags:
        - config
      when:
        - os: windows
